<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDL Video AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:25px 15px 50px;
}

h1{
    text-align:center;
    margin:10px 0;
    font-size:32px;
}

.sub{
    text-align:center;
    color:#999;
    margin-bottom:25px;
}

.card{
    background:#151515;
    border:1px solid #292929;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
}

.upload{
    min-height:180px;
    border:2px dashed #555;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    cursor:pointer;
}

.upload:active{
    transform:scale(.98);
}

.icon{
    font-size:45px;
    margin-bottom:10px;
}

#file{
    display:none;
}

#video{
    width:100%;
    margin-top:18px;
    border-radius:12px;
    display:none;
    background:black;
}

.info{
    display:none;
    margin-top:12px;
    padding:12px;
    background:#202020;
    border-radius:10px;
    color:#ccc;
    font-size:14px;
    line-height:1.8;
}

label{
    display:block;
    margin:15px 0 7px;
}

select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #333;
    background:#222;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:0;
    border-radius:12px;
    background:white;
    color:black;
    font-size:17px;
    font-weight:bold;
}

#message{
    text-align:center;
    color:#aaa;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="app">

<h1>🚀 MDL Video AI</h1>

<div class="sub">
محسن جودة الفيديو
</div>

<div class="card">

<label class="upload" for="file">

<div class="icon">🎥</div>

<div>اضغط هنا لاختيار الفيديو</div>

<div style="color:#888;margin-top:8px">
MP4 • MOV • WebM وغيرها
</div>

<input
    id="file"
    type="file"
    accept="video/*"
>

</label>

<video
    id="video"
    controls
    playsinline
></video>

<div id="info" class="info"></div>

</div>

<div class="card">

<label>الدقة المطلوبة</label>

<select id="quality">
<option value="1080">1080p Full HD</option>
<option value="1440">2K</option>
<option value="2160">4K</option>
</select>

<label>قوة التحسين</label>

<select id="level">
<option>خفيف</option>
<option>متوسط</option>
<option>قوي</option>
</select>

<button id="start">
✨ بدء التحسين
</button>

<div id="message">
اختر فيديو للبدء
</div>

</div>

</div>

<script>

const fileInput = document.getElementById("file");
const video = document.getElementById("video");
const info = document.getElementById("info");
const message = document.getElementById("message");
const start = document.getElementById("start");

let videoURL = null;

fileInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    if(!file.type.startsWith("video/")){
        message.textContent = "هذا الملف ليس فيديو ❌";
        return;
    }

    if(videoURL){
        URL.revokeObjectURL(videoURL);
    }

    videoURL = URL.createObjectURL(file);

    video.src = videoURL;
    video.style.display = "block";

    const sizeMB = (file.size / 1024 / 1024).toFixed(2);

    info.innerHTML =
        "📁 الاسم: " + file.name +
        "<br>" +
        "📦 الحجم: " + sizeMB + " MB" +
        "<br>" +
        "🎬 النوع: " + file.type;

    info.style.display = "block";

    message.textContent = "تم تحميل الفيديو بنجاح ✅";

});

start.addEventListener("click", function(){

    if(!fileInput.files.length){

        message.textContent =
            "⚠️ اختار فيديو أولاً";

        return;
    }

    const quality =
        document.getElementById("quality").value;

    const level =
        document.getElementById("level").value;

    message.textContent =
        "تم اختيار " + quality +
        "p — التحسين: " + level +
        " ✅";});

</script>

</body>
</html>
